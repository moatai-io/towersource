<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    </style>

    <!-- Glow filters -->
    <filter id="glow-emerald" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#10B981" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F59E0B" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#06B6D4" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-indigo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#6366F1" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Energy beam gradient -->
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- LAYER 1: SKILLS (bottom) — Emerald — begin 0.5s              -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.8s" fill="freeze"
      calcMode="spline" keySplines="0 0 0.2 1" keyTimes="0;1"/>

    <!-- Layer number badge -->
    <circle cx="148" cy="470" r="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="148" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7">1</text>

    <!-- Main bar -->
    <rect x="180" y="448" width="280" height="44" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2" filter="url(#glow-emerald)"/>
    <rect x="180" y="448" width="280" height="44" rx="8" fill="#10B981" opacity="0.08"/>
    <text x="320" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#6EE7B7">Skills</text>

    <!-- Description -->
    <text x="490" y="466" font-size="12" fill="#9CA3AF">Raw capabilities</text>
    <text x="490" y="482" font-size="11" fill="#6B7280" font-style="italic">what an agent can do</text>

    <!-- Example pills -->
    <rect x="610" y="452" width="70" height="20" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="0.8"/>
    <text x="645" y="466" text-anchor="middle" class="mono" font-size="8" fill="#6EE7B7">deploy.md</text>
    <rect x="690" y="452" width="60" height="20" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="0.8"/>
    <text x="720" y="466" text-anchor="middle" class="mono" font-size="8" fill="#6EE7B7">test.md</text>
    <rect x="640" y="478" width="80" height="20" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="0.8"/>
    <text x="680" y="492" text-anchor="middle" class="mono" font-size="8" fill="#6EE7B7">docker-build</text>

    <!-- Passive float -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-1.5;0,0" dur="4s" begin="10s" repeatCount="indefinite"/>
  </g>

  <!-- Connector 1→2 -->
  <line x1="320" y1="448" x2="320" y2="416" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="80" stroke-dashoffset="80" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="80;0" dur="0.4s" begin="1.3s" fill="freeze"/>
  </line>

  <!-- ============================================================ -->
  <!-- LAYER 2: AGENTS — Purple — begin 1.5s                        -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.8s" fill="freeze"
      calcMode="spline" keySplines="0 0 0.2 1" keyTimes="0;1"/>

    <circle cx="148" cy="390" r="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="148" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#C4B5FD">2</text>

    <rect x="180" y="368" width="280" height="44" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="2" filter="url(#glow-purple)"/>
    <rect x="180" y="368" width="280" height="44" rx="8" fill="#8B5CF6" opacity="0.08"/>
    <text x="320" y="396" text-anchor="middle" font-size="16" font-weight="700" fill="#C4B5FD">Agents</text>

    <text x="490" y="386" font-size="12" fill="#9CA3AF">Scale + parallelism</text>
    <text x="490" y="402" font-size="11" fill="#6B7280" font-style="italic">specialization at work</text>

    <!-- Agent icons (small person silhouettes) -->
    <circle cx="630" cy="382" r="6" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="630" cy="379" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="0.8"/>
    <circle cx="660" cy="382" r="6" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="660" cy="379" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="0.8"/>
    <circle cx="690" cy="382" r="6" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="690" cy="379" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="0.8"/>
    <!-- Parallel lines between agents -->
    <line x1="637" y1="382" x2="653" y2="382" stroke="#8B5CF6" stroke-width="0.8" stroke-dasharray="3 2"/>
    <line x1="667" y1="382" x2="683" y2="382" stroke="#8B5CF6" stroke-width="0.8" stroke-dasharray="3 2"/>
    <text x="660" y="402" text-anchor="middle" class="mono" font-size="8" fill="#9CA3AF">parallel</text>

    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-1.5;0,0" dur="4.3s" begin="10.3s" repeatCount="indefinite"/>
  </g>

  <!-- Connector 2→3 -->
  <line x1="320" y1="368" x2="320" y2="336" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="80" stroke-dashoffset="80" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="80;0" dur="0.4s" begin="2.3s" fill="freeze"/>
  </line>

  <!-- ============================================================ -->
  <!-- LAYER 3: PROMPTS — Amber — begin 2.5s                        -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.8s" fill="freeze"
      calcMode="spline" keySplines="0 0 0.2 1" keyTimes="0;1"/>

    <circle cx="148" cy="310" r="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="148" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#FCD34D">3</text>

    <rect x="180" y="288" width="280" height="44" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" filter="url(#glow-amber)"/>
    <rect x="180" y="288" width="280" height="44" rx="8" fill="#F59E0B" opacity="0.08"/>
    <text x="320" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#FCD34D">Prompts</text>

    <text x="490" y="306" font-size="12" fill="#9CA3AF">Orchestration layer</text>
    <text x="490" y="322" font-size="11" fill="#6B7280" font-style="italic">coordinate skills + agents</text>

    <!-- Orchestration arrows -->
    <path d="M625,300 L645,290 L645,296 L680,296 L680,304 L645,304 L645,310 Z" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.7"/>
    <path d="M695,300 L715,290 L715,296 L750,296 L750,304 L715,304 L715,310 Z" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>

    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-1.5;0,0" dur="3.8s" begin="10.6s" repeatCount="indefinite"/>
  </g>

  <!-- Connector 3→4 -->
  <line x1="320" y1="288" x2="320" y2="256" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="80" stroke-dashoffset="80" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="80;0" dur="0.4s" begin="3.3s" fill="freeze"/>
  </line>

  <!-- ============================================================ -->
  <!-- LAYER 4: JUSTFILE — Cyan — begin 3.5s                        -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.8s" fill="freeze"
      calcMode="spline" keySplines="0 0 0.2 1" keyTimes="0;1"/>

    <circle cx="148" cy="230" r="14" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="148" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#67E8F9">4</text>

    <rect x="180" y="208" width="280" height="44" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="2" filter="url(#glow-cyan)"/>
    <rect x="180" y="208" width="280" height="44" rx="8" fill="#06B6D4" opacity="0.08"/>
    <text x="320" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#67E8F9">Justfile</text>

    <text x="490" y="226" font-size="12" fill="#9CA3AF">Terminal access</text>
    <text x="490" y="242" font-size="11" fill="#6B7280" font-style="italic">no interactive session needed</text>

    <!-- Terminal icon -->
    <rect x="625" y="215" width="80" height="30" rx="4" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
    <text x="635" y="235" class="mono" font-size="9" fill="#67E8F9">$ just deploy</text>
    <!-- Cursor blink -->
    <rect x="700" y="226" width="6" height="12" fill="#06B6D4" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" begin="10s" repeatCount="indefinite"/>
    </rect>

    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-1.5;0,0" dur="4.1s" begin="10.9s" repeatCount="indefinite"/>
  </g>

  <!-- Connector 4→5 -->
  <line x1="320" y1="208" x2="320" y2="176" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="80" stroke-dashoffset="80" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="80;0" dur="0.4s" begin="4.3s" fill="freeze"/>
  </line>

  <!-- ============================================================ -->
  <!-- LAYER 5: THE LIBRARY (top) — Indigo — begin 4.5s             -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.8s" fill="freeze"
      calcMode="spline" keySplines="0 0 0.2 1" keyTimes="0;1"/>

    <circle cx="148" cy="150" r="14" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <text x="148" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#A5B4FC">5</text>

    <rect x="180" y="128" width="280" height="44" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="2.5" filter="url(#glow-indigo)"/>
    <rect x="180" y="128" width="280" height="44" rx="8" fill="#6366F1" opacity="0.12"/>
    <text x="320" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#A5B4FC">The Library</text>

    <text x="490" y="146" font-size="12" fill="#9CA3AF">Distribution layer</text>
    <text x="490" y="162" font-size="11" fill="#6B7280" font-style="italic">devices, teams, agents</text>

    <!-- Distribution nodes -->
    <circle cx="640" cy="140" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
    <text x="640" y="143" text-anchor="middle" font-size="7" fill="#A5B4FC">D</text>
    <circle cx="680" cy="130" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
    <text x="680" y="133" text-anchor="middle" font-size="7" fill="#A5B4FC">T</text>
    <circle cx="720" cy="140" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
    <text x="720" y="143" text-anchor="middle" font-size="7" fill="#A5B4FC">A</text>
    <!-- Connection arcs -->
    <path d="M648,138 Q660,120 672,132" fill="none" stroke="#6366F1" stroke-width="0.8" opacity="0.6"/>
    <path d="M688,132 Q700,118 712,138" fill="none" stroke="#6366F1" stroke-width="0.8" opacity="0.6"/>
    <path d="M648,142 Q680,160 712,142" fill="none" stroke="#6366F1" stroke-width="0.8" opacity="0.4"/>
    <!-- Labels -->
    <text x="640" y="160" text-anchor="middle" font-size="7" fill="#6B7280">device</text>
    <text x="680" y="118" text-anchor="middle" font-size="7" fill="#6B7280">team</text>
    <text x="720" y="160" text-anchor="middle" font-size="7" fill="#6B7280">agent</text>

    <!-- Glow pulse on top layer -->
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" begin="10s" repeatCount="indefinite"/>

    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,-1.5;0,0" dur="3.6s" begin="11.2s" repeatCount="indefinite"/>
  </g>

  <!-- ============================================================ -->
  <!-- ENERGY BEAM (6s) — vertical light pulse through stack         -->
  <!-- ============================================================ -->
  <rect x="316" y="128" width="8" height="364" rx="4" fill="url(#beam)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.4;0.15;0.15" keyTimes="0;0.001;0.3;0.8;1" dur="2s" begin="6s" fill="freeze"/>
  </rect>
  <!-- Upward particle burst at top -->
  <circle cx="320" cy="128" r="0" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="0;25;35" dur="0.8s" begin="6.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="0.8s" begin="6.5s" fill="freeze"/>
  </circle>
  <circle cx="320" cy="128" r="0" fill="none" stroke="#A5B4FC" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="0;40;55" dur="1s" begin="6.7s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="1s" begin="6.7s" fill="freeze"/>
  </circle>

  <!-- Passive beam shimmer -->
  <rect x="317" y="128" width="6" height="364" rx="3" fill="url(#beam)" opacity="0">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- ============================================================ -->
  <!-- LEFT BRACKET — visual "stack" indicator                       -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.3" begin="6s" dur="0.8s" fill="freeze"/>
    <path d="M130,130 L120,130 L120,490 L130,490" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round"/>
    <text x="108" y="315" text-anchor="middle" font-size="10" fill="#6B7280" transform="rotate(-90, 108, 315)">AGENTIC STACK</text>
  </g>

  <!-- ============================================================ -->
  <!-- TITLE (8s)                                                    -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.8s" fill="freeze"/>
    <text x="400" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="#E0E0E0">The Agentic Stack</text>
  </g>

  <!-- Decorative line under title -->
  <line x1="300" y1="550" x2="500" y2="550" stroke="#6366F1" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" begin="8s" dur="0.6s" fill="freeze"/>
  </line>

  <!-- Subtitle -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.8" begin="8.8s" dur="0.6s" fill="freeze"/>
    <text x="400" y="572" text-anchor="middle" font-size="12" fill="#9CA3AF">Five layers from raw capability to universal distribution</text>
  </g>

  <!-- ============================================================ -->
  <!-- UPWARD ARROW HINTS (9s) — subtle directional cues             -->
  <!-- ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.25" begin="9s" dur="0.6s" fill="freeze"/>
    <!-- Small upward chevrons on the left -->
    <path d="M108,420 L115,414 L122,420" fill="none" stroke="#10B981" stroke-width="1" stroke-linecap="round"/>
    <path d="M108,340 L115,334 L122,340" fill="none" stroke="#F59E0B" stroke-width="1" stroke-linecap="round"/>
    <path d="M108,260 L115,254 L122,260" fill="none" stroke="#06B6D4" stroke-width="1" stroke-linecap="round"/>
    <path d="M108,180 L115,174 L122,180" fill="none" stroke="#6366F1" stroke-width="1" stroke-linecap="round"/>
  </g>

</svg>
