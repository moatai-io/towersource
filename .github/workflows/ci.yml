name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# 같은 브랜치에 연속 push 시 이전 run 취소 (Actions 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Unit and source contracts
        run: npm test
        env:
          VITEST_MAX_WORKERS: 2

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (no native dialogs)
        run: npm run lint:dialogs

      - name: Build
        run: npm run build
