name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# 같은 브랜치에 연속 push 시 이전 run 취소 (Actions 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Prepare integration test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-venv python3-pil python3-fitz python3-openpyxl python3-reportlab python3-ezdxf python3-matplotlib python3-pandas poppler-utils
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/tower-test-python"
          "$RUNNER_TEMP/tower-test-python/bin/pip" install pdfplumber==0.11.7
          "$RUNNER_TEMP/tower-test-python/bin/python" -c "import PIL, fitz, openpyxl, reportlab, ezdxf, matplotlib, pdfplumber, pandas"
          echo "$RUNNER_TEMP/tower-test-python/bin" >> "$GITHUB_PATH"
          echo "TOWER_DOCUMENT_PYTHON=$RUNNER_TEMP/tower-test-python/bin/python" >> "$GITHUB_ENV"
          docker pull postgres:16-alpine
          # Ubuntu restricts unprivileged user namespaces by default; this
          # disposable runner executes the sandbox integration tests explicitly.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install (clean)
        run: npm ci

      - name: Unit and source contracts
        run: npm test
        env:
          VITEST_MAX_WORKERS: 2

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (no native dialogs)
        run: npm run lint:dialogs

      - name: Build
        run: npm run build
