<!DOCTYPE html>
<html lang="ko">
  <head>
    <script src="/runtime-config.js"></script>
    <script>
      (function() {
        var saved = null;
        try { saved = localStorage.getItem('tower:lang'); } catch (_) {}
        var configured = window.__TOWER_RUNTIME_CONFIG__ && window.__TOWER_RUNTIME_CONFIG__.defaultLanguage;
        var language = saved === 'ko' || saved === 'en'
          ? saved
          : configured === 'ko' || configured === 'en'
            ? configured
            : 'ko';
        document.documentElement.lang = language;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Tower</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" sizes="192x192" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tower" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Fonts load on use with font-display: swap; do not compete with startup JS. -->
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body class="text-gray-100" style="font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif; background-color: var(--th-bg-primary);">
    <script>
      // Apply saved theme & font size immediately to prevent flash
      (function() {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var fs = localStorage.getItem('tower:font-size');
        if (fs) document.documentElement.setAttribute('data-font-size', fs);
      })();
      // PWA service worker is managed by vite-plugin-pwa (registerType: 'autoUpdate').
      // Deployed hosts keep the PWA registration. Development hosts must remove
      // registrations left by older builds: merely skipping registerSW() does not
      // stop an already-active worker from controlling the current browser tab.
      (function() {
        var isDevHost = location.hostname === 'app.localhost' || location.hostname.indexOf('desk-dev.') === 0;
        if (!isDevHost || !('serviceWorker' in navigator)) return;

        var cleanupKey = 'tower:dev-sw-cleanup-v1';
        var wasControlled = !!navigator.serviceWorker.controller;
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(reg) { return reg.unregister(); }));
          }),
          'caches' in window ? caches.keys().then(function(keys) {
            return Promise.all(keys.filter(function(key) {
              return key.indexOf('workbox-precache') === 0 || key.indexOf('js-runtime-cache') !== -1;
            }).map(function(key) { return caches.delete(key); }));
          }) : Promise.resolve(),
        ]).then(function() {
          if (!wasControlled || sessionStorage.getItem(cleanupKey) === '1') return;
          sessionStorage.setItem(cleanupKey, '1');
          var url = new URL(location.href);
          url.searchParams.delete('__tower_reload');
          location.replace(url.toString());
        }).catch(function() {
          // Dev cleanup is best-effort; Vite can still surface the underlying error.
        });
      })();

      // Boot watchdog: recover once when an old service worker/runtime cache
      // leaves the page stuck on the static Loading fallback. Healthy mounted
      // tabs are never reloaded by this path.
      (function() {
        if (location.search.indexOf('reset-sw') !== -1 || location.search.indexOf('reset-client') !== -1) return;
        // Vite development hosts can legitimately spend more than the watchdog
        // window transforming a changed module graph, and syntax errors are
        // fixed through HMR. Reloading here restarts the same transform and can
        // create an endless __tower_reload loop. Boot recovery is only for a
        // deployed app shell with potentially stale service-worker caches.
        var isDevHost = location.hostname === 'app.localhost' || location.hostname.indexOf('desk-dev.') === 0;
        if (isDevHost) return;
        var guardKey = 'tower:boot-recovery-ts';
        var lastRecovery = 0;
        try { lastRecovery = parseInt(sessionStorage.getItem(guardKey) || '0', 10); } catch (_) {}

        function isRecoverableBootError(value) {
          var message = value && (value.message || value.reason && value.reason.message || String(value.reason || value)) || '';
          return /dynamically imported module|module script|ChunkLoadError|Loading chunk|Failed to fetch/i.test(message);
        }

        function recoverOnce(reason) {
          if (document.documentElement.hasAttribute('data-app-mounted')) return;
          var status = document.getElementById('tower-boot-message');
          if (status) status.textContent = '화면을 불러오지 못했습니다. 아래 버튼으로 화면 캐시를 복구해 주세요.';
          var retry = document.getElementById('tower-boot-retry');
          if (retry) retry.hidden = false;
          // One automatic attempt per window session. Manual recovery remains
          // available even when storage is blocked or repeated loads fail.
          if (lastRecovery) return;
          lastRecovery = Date.now();
          try {
            sessionStorage.setItem(guardKey, String(lastRecovery));
            sessionStorage.setItem('tower:reload-reason', reason);
          } catch (_) { return; }

          var cleanup = Promise.resolve();
          if ('caches' in window) {
            cleanup = caches.keys().then(function(keys) {
              return Promise.all(keys.filter(function(key) {
                return key.indexOf('js-runtime-cache') !== -1 || key.indexOf('workbox-precache') === 0;
              }).map(function(key) { return caches.delete(key); }));
            });
          }
          cleanup.catch(function() {}).then(function() {
            var url = new URL(location.href);
            url.searchParams.set('__tower_reload', String(Date.now()));
            location.replace(url.toString());
          });
        }

        window.addEventListener('error', function(event) {
          if (isRecoverableBootError(event.error || event.message)) recoverOnce('boot-script-error');
        });
        window.addEventListener('unhandledrejection', function(event) {
          if (isRecoverableBootError(event)) recoverOnce('boot-promise-error');
        });
        setTimeout(function() {
          if (!document.documentElement.hasAttribute('data-app-mounted')) recoverOnce('boot-timeout');
        }, 10000);
      })();

      // Escape hatch: if the user lands on /?reset-sw, unregister every SW and
      // wipe every Cache, then redirect home. This is the manual recovery path
      // for users whose old cached SW got stuck and refused to upgrade — a real
      // observed failure mode on iOS Chrome (WKWebView) when the precache hit
      // the WebKit Cache quota and new SW install() began failing silently.
      // Inline so it runs even when the main bundle never loads.
      // Usage: paste tower.tower.example.com/?reset-sw into the address bar once.
      (function() {
        if (location.search.indexOf('reset-sw') === -1) return;
        if (!('serviceWorker' in navigator)) { location.replace('/'); return; }
        navigator.serviceWorker.getRegistrations()
          .then(function(regs) { return Promise.all(regs.map(function(r) { return r.unregister(); })); })
          .then(function() {
            if (!('caches' in window)) return;
            return caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            });
          })
          .then(function() { location.replace('/'); })
          .catch(function() { location.replace('/'); });
      })();
    </script>
    <div id="tower-boot-status" role="status" style="position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#f8fafc;color:#334155;font:16px/1.6 system-ui;text-align:center">
      <strong>Tower</strong>
      <p id="tower-boot-message">화면을 불러오고 있습니다…</p>
      <a id="tower-boot-retry" hidden href="/api/client-reset" style="color:#0f766e">최신 화면 다시 불러오기</a>
      <small>화면 캐시만 복구하며 서버에 저장된 대화와 파일은 유지됩니다.</small>
    </div>
    <script>
      document.getElementById('tower-boot-retry').href = '/api/client-reset?returnTo=' + encodeURIComponent(location.pathname + location.search + location.hash);
    </script>
    <div id="root"></div>
    <noscript><div style="padding:2rem;text-align:center;color:#f59e0b;">JavaScript is required to use Tower.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
